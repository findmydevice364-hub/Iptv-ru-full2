
name: NTV Master Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: ntv-master-scan
  cancel-in-progress: false

jobs:
  scan-ntv:
    name: Scan NTV CDN and publish reports
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Download and validate scanner
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/findmydevice364-hub/Iptv-ru-full2/main/ntv_master_scanner.py" \
            --output ntv_master_scanner.py

          test -s ntv_master_scanner.py
          python -m py_compile ntv_master_scanner.py

      - name: Run NTV scan
        env:
          PYTHONUNBUFFERED: "1"
          NTV_CONFIG: "Ntv/ntv_scan_config.json"
          NTV_CONFIG_URL: "https://raw.githubusercontent.com/findmydevice364-hub/Iptv-ru-full2/main/Ntv/ntv_scan_config.json"
          NTV_OUTPUT_DIR: "Ntv/output"
        run: |
          set -euo pipefail
          python -u ntv_master_scanner.py \
            --concurrency 24 \
            --timeout 15

      - name: Validate scan reports
        run: |
          set -euo pipefail

          for f in \
            ntv_report.csv \
            ntv_streams.csv \
            ntv_found.m3u \
            ntv_masters.txt \
            ntv_target_channels.txt \
            ntv_node_checks.csv \
            ntv_node_timezones.csv \
            ntv_orbit_evidence.csv \
            ntv_scan_summary.json; do

            if [ ! -s "Ntv/output/$f" ]; then
              echo "::error::Missing or empty report: Ntv/output/$f"
              exit 1
            fi
          done

          echo "All expected reports are present."
          ls -lh Ntv/output/

      - name: Determine next release number
        id: numbering
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          gh release list \
            --repo "$GH_REPO" \
            --limit 200 \
            --json tagName \
            --jq '.[].tagName' > /tmp/ntv-tags.txt || true

          MAX=0

          while IFS= read -r tag; do
            if [[ "$tag" =~ ^ntv-scan_([0-9]+)$ ]]; then
              n="${BASH_REMATCH[1]}"
              if (( n > MAX )); then
                MAX="$n"
              fi
            fi
          done < /tmp/ntv-tags.txt

          NEXT=$((MAX + 1))

          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=ntv-scan_$NEXT" >> "$GITHUB_OUTPUT"

          echo "Next release: ntv-scan_$NEXT"

      - name: Create numbered historical report copies
        env:
          SCAN_NUMBER: ${{ steps.numbering.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          for f in Ntv/output/ntv_*; do
            [[ -f "$f" ]] || continue

            name="$(basename "$f")"
            stem="${name%.*}"
            ext="${name##*.}"

            # Preserve old numbered copies without numbering them again.
            if [[ ! "$stem" =~ _[0-9]+$ ]]; then
              cp "$f" \
                "Ntv/output/${stem}_${SCAN_NUMBER}.${ext}"
            fi
          done

          echo "Current and archived reports:"
          find Ntv/output -maxdepth 1 -type f -print | sort

      - name: Upload all reports as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntv-scan-${{ steps.numbering.outputs.number }}-reports
          path: Ntv/output/
          if-no-files-found: error
          retention-days: 30

      - name: Commit reports to repository
        env:
          SCAN_NUMBER: ${{ steps.numbering.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Ntv/output/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "NTV scan #${SCAN_NUMBER}: update reports"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Publish release with every report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.numbering.outputs.tag }}
          SCAN_NUMBER: ${{ steps.numbering.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t FILES < <(
            find Ntv/output -maxdepth 1 -type f -print | sort
          )

          if (( ${#FILES[@]} == 0 )); then
            echo "::error::No report files to attach to release."
            exit 1
          fi

          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GH_REPO" \
            --title "NTV Scan #${SCAN_NUMBER}" \
            --target "$GITHUB_SHA" \
            --notes "Автоматический отчёт NTV CDN/HLS.

          В релиз приложены все отчёты текущего сканирования и их нумерованные копии.
          Отчёты также сохраняются в Ntv/output/ репозитория.

          Запуск: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Важно: найденные URL-кандидаты и орбитальные соответствия необходимо подтверждать результатами проверки. Сам факт ответа CDN не гарантирует длительную доступность потока."
