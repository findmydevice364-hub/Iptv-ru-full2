
name: NTV Master Playlist Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

concurrency:
  group: ntv-master-scan
  cancel-in-progress: false

jobs:
  scan-ntv:
    name: Scan NTV CDN nodes
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp

      - name: Download scanner
        run: |
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/findmydevice364-hub/Iptv-ru-full2/main/ntv_master_scanner.py" \
            --output ntv_master_scanner.py
          test -s ntv_master_scanner.py
          python -m py_compile ntv_master_scanner.py

      - name: Run NTV scanner
        env:
          PYTHONUNBUFFERED: "1"
        run: python -u ntv_master_scanner.py

      - name: Verify reports
        run: |
          test -s ntv_report.csv
          test -s ntv_found.m3u
          test -s ntv_masters.txt

      - name: Upload scan reports as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntv-scan-reports-${{ github.run_number }}
          path: |
            ntv_report.csv
            ntv_found.m3u
            ntv_masters.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="ntv-scan-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            ntv_report.csv \
            ntv_found.m3u \
            ntv_masters.txt \
            --title "NTV Scan #${GITHUB_RUN_NUMBER}" \
            --notes "Автоматический отчёт сканирования NTV CDN.
          Запуск: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Источник сканера: https://raw.githubusercontent.com/findmydevice364-hub/Iptv-ru-full2/main/ntv_master_scanner.py" \
            --target "$GITHUB_SHA"
