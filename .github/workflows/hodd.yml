name: HLS Inspector and Push Report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */6 * * *"

permissions:
  contents: write

concurrency:
  group: hls-inspector-report
  cancel-in-progress: false

jobs:
  inspect-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests m3u8

      - name: Run HLS inspector and save report
        shell: bash
        run: |
          mkdir -p reports

          {
            echo "HLS Inspector Report"
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Date UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Commit: $GITHUB_SHA"
            echo "========================================"
            echo
          } > reports/hodd-report.txt

          set +e
          python -u hodd.py >> reports/hodd-report.txt 2>&1
          STATUS=$?
          set -e

          {
            echo
            echo "========================================"
            echo "Script exit code: $STATUS"
            echo "Finished UTC: $(date -u '+%Y-%m-%d %H:%M:%S')"
          } >> reports/hodd-report.txt

          echo "HLS_EXIT_CODE=$STATUS" >> "$GITHUB_ENV"

      - name: Commit and push report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/hodd-report.txt

          if git diff --cached --quiet; then
            echo "Report unchanged; nothing to push."
          else
            git commit -m "Update HLS inspection report"
            git push origin HEAD:main
          fi

      - name: Report script status
        if: always()
        run: |
          echo "HLS inspector exit code: ${HLS_EXIT_CODE:-unknown}"
          echo "Report path: reports/hodd-report.txt"