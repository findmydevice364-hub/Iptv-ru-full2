name: FFprobe Playlist Scan

on:
  workflow_dispatch: # Позволяет запускать вручную из вкладки Actions
  schedule:
    - cron: '0 3 * * 0' # Каждое воскресенье в 3:00 ночи (можете изменить)

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий (включая папку output, если там есть исходный all_clean.m3u)
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Устанавливаем ffprobe (входит в пакет ffmpeg)
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Запускаем ваш скрипт пробивки с правильным именем файла
      - name: Run probe script
        run: |
          python3 FFprobe_PlaylistScan.py

      # 5. Сохраняем результаты (папку output) как артефакт GitHub
      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: playlist-probe-results
          path: output/
          retention-days: 30

      # 6. Автоматический коммит обновленных результатов обратно в репозиторий
      - name: Commit and push changes if results changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add output/
          git status
          git diff --staged --quiet || git commit -m "Auto-update playlist probe results [skip ci]"
          git push
