name: FFprobe Playlist Scan

on:
  workflow_dispatch:

  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version

      - name: Verify input playlist
        run: |
          test -f output/all_clean.m3u || {
            echo "::error::Missing output/all_clean.m3u"
            exit 1
          }

          test -f FFprobe_PlaylistScan.py || {
            echo "::error::Missing FFprobe_PlaylistScan.py"
            exit 1
          }

      - name: Run probe script
        run: python3 FFprobe_PlaylistScan.py

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playlist-probe-results
          path: output/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit and push results
        if: success()
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          git add output/

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update IPTV probe results [skip ci]"
          git push