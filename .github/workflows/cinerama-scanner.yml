name: Cinerama Scanner

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner with full output
        run: |
          echo "=== Starting scanner ==="
          python -u SCANNER_CINERAMA.py 2>&1 | tee scanner.log
          echo "=== Scanner finished ==="
          echo ""
          echo "=== Checking directory ==="
          pwd
          ls -lah
          echo ""
          echo "=== Checking for output files ==="
          ls -lah *.m3u *.txt 2>&1 || echo "Files not found!"

      - name: Show scanner log
        if: always()
        run: |
          echo "=== Scanner output ==="
          cat scanner.log || echo "No log file"

      - name: Debug: check what happened
        if: always()
        run: |
          echo "Exit code of scanner: $?"
          find . -name "*.m3u" -o -name "*.txt" | head -20

      - name: Upload artifact
        if: hashFiles('cinerama_Verified_1.m3u') != ''
        uses: actions/upload-artifact@v4
        with:
          name: cinerama-scan-results
          path: |
            cinerama_Verified_1.m3u
            SKALA_DREG_REPORT.txt
          retention-days: 90

      - name: Commit and push to repo root
        if: hashFiles('cinerama_Verified_1.m3u') != ''
        run: |
          git config user.name "Cinerama Bot"
          git config user.email "bot@github.com"

          git add cinerama_Verified_1.m3u SKALA_DREG_REPORT.txt

          if ! git diff --cached --quiet; then
            git commit -m "🔄 Cinerama scan: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "✅ Pushed to main"
          else
            echo "ℹ️ No changes"
          fi