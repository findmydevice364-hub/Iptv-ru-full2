name: Cinerama Scanner

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        run: |
          python SCANNER_CINERAMA.py
          ls -la
          echo "---- generated files ----"
          ls -la *.m3u *.txt 2>/dev/null || true

      - name: Verify files exist
        run: |
          test -f cinerama_Verified_1.m3u
          test -f SKALA_DREG_REPORT.txt
          echo "Files verified"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinerama-scan-results
          path: |
            cinerama_Verified_1.m3u
            SKALA_DREG_REPORT.txt
          retention-days: 90

      - name: Commit and push to repo root
        run: |
          git config user.name "Cinerama Bot"
          git config user.email "bot@github.com"

          git add cinerama_Verified_1.m3u SKALA_DREG_REPORT.txt

          if ! git diff --cached --quiet; then
            git commit -m "🔄 Cinerama scan: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "Pushed to main"
          else
            echo "No changes to push"
          fi