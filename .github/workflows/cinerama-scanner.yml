name: Cinerama Scanner

on:
  schedule:
    # Запускается каждый день в 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Cinerama Scanner
        id: scanner
        run: |
          python SCANNER_CINERAMA.py
          echo "scan_completed=true" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        if: steps.scanner.outputs.scan_completed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cinerama-scan-results
          path: |
            cinerama_Verified_1.m3u
            SKALA_DREG_REPORT.txt
          retention-days: 90

      - name: Download artifacts for commit
        if: steps.scanner.outputs.scan_completed == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cinerama-scan-results
          path: ./artifacts

      - name: Copy artifacts to root
        if: steps.scanner.outputs.scan_completed == 'true'
        run: |
          cp ./artifacts/cinerama_Verified_1.m3u ./
          cp ./artifacts/SKALA_DREG_REPORT.txt ./
          ls -la *.m3u *.txt

      - name: Commit and push to root
        if: steps.scanner.outputs.scan_completed == 'true'
        run: |
          git config user.name "Cinerama Bot"
          git config user.email "bot@github.com"
          
          # Проверяем изменения
          if git diff --name-only | grep -E "(cinerama_Verified_1.m3u|SKALA_DREG_REPORT.txt)"; then
            git add cinerama_Verified_1.m3u SKALA_DREG_REPORT.txt
            git commit -m "🔄 Cinerama scan: $(date '+%Y-%m-%d %H:%M:%S UTC')"
            git push origin main
            echo "✅ Changes pushed to main"
          else
            echo "ℹ️ No changes detected"
          fi