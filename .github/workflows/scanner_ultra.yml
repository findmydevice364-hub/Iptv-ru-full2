name: IPTV Ultra Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"   # раз в день в 03:00 UTC

jobs:
  scan-iptv:
    runs-on: ubuntu-latest
    timeout-minutes: 1200

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp

      - name: Create source list (optional)
        run: |
          mkdir -p .github/workflows
          cat > sources.txt <<'EOF'
          # один URL на строку, можно оставить пустым
          # https://example.com/playlist.m3u
          EOF

      - name: Run IPTV scanner
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python scanner_ultra.py \
            --output ./iptv_output \
            --passes 1 \
            --workers 64 \
            --alt-workers 48 \
            --source-workers 64 \
            --timeout 12 \
            --source-timeout 30 \
            --min-alternatives 6 \
            --alternative-candidates 50 \
            --ops-per-second 64 \
            --similarity 0.60 \
            --ffprobe \
            --source-list ./sources.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iptv-results
          path: |
            ./iptv_output/**
            ./scanner_ultra_mega.log
          if-no-files-found: warn
          retention-days: 7